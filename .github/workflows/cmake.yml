name: CMake

on:
  # push covers dev (post-merge validation and beta releases) and master
  # (release builds). pull_request covers PRs against dev, so branches only
  # build once a PR is open instead of on every push.
  push:
    branches:
      - dev
      - master
    paths: &cmake-paths
      # C/C++ source and headers
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.h'
      # Win32 resources
      - '**/*.rc'
      - '**/*.ico'
      - '**/*.manifest'
      # Launcher web UI, embedded into both launchers
      - 'GWToolbox/web/**'
      - 'resources/**'
      # Build system
      - 'CMakeLists.txt'
      - 'cmake/*.cmake'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg-overlays/**'
      # The build and toolchain scripts it runs
      - 'scripts/*.py'
      - 'scripts/llvm-mingw.version'
      - 'scripts/*.sh'
      # The workflow itself
      - '.github/workflows/cmake.yml'
  pull_request:
    branches:
      - dev
    paths: *cmake-paths

# Cancel a still-running build for the same ref when a new commit supersedes it.
concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install host packages
      # Same list as bootstrap.sh: the compiler builds the Linux launcher and vkd3d-compiler, and vcpkg needs zip,
      # unzip and pkg-config.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build zip unzip pkg-config build-essential bison flex \
          libjson-perl libvulkan-dev

    - name: Install CMake 3.29+
      run: |
        pipx install 'cmake>=3.29'
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Determine release version
      id: version
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
      shell: bash
      run: |
        VERSION=$(sed -n 's/.*set(GWTOOLBOXDLL_VERSION "\(.*\)").*/\1/p' CMakeLists.txt | tr -d '\r')
        BETA=$(sed -n 's/.*set(GWTOOLBOXDLL_VERSION_BETA "\(.*\)").*/\1/p' CMakeLists.txt | tr -d '\r')

        if [ -z "$VERSION" ]; then
          echo "Could not find version in CMakeLists.txt"
          exit 1
        fi

        if [ "$GITHUB_REF" = 'refs/heads/dev' ] && [ -z "$BETA" ]; then
          echo "Dev builds require a beta version. Skipping release."
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -z "$BETA" ]; then
          TAG_NAME="${VERSION}_Release"
        else
          TAG_NAME="${VERSION}_${BETA}"
        fi

        echo "Detected version: $VERSION"
        echo "Detected beta: $BETA"
        echo "Target tag: $TAG_NAME"
        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if [ -n "$BETA" ]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

        if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q .; then
          echo "Tag $TAG_NAME already exists. Skipping release."
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        else
          echo "Tag $TAG_NAME does not exist. Will create release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache toolchain and vcpkg
      uses: actions/cache@v4
      with:
        path: |
          .toolchain
          .vcpkg
        key: toolchain-linux-${{ hashFiles('scripts/llvm-mingw.version', 'vcpkg-configuration.json', 'scripts/toolchain.py') }}

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: vcpkg-bincache
        key: vcpkg-bin-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'scripts/llvm-mingw.version') }}
        restore-keys: |
          vcpkg-bin-linux-

    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          build/Linux/relwithdebinfo/_deps
          build/Linux/vcpkg_installed
        key: deps-linux-${{ hashFiles('cmake/*.cmake', 'vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**', 'scripts/llvm-mingw.version') }}
        restore-keys: |
          deps-linux-

    - name: Bootstrap
      # Installs llvm-mingw and vkd3d-compiler into .toolchain/, checks vcpkg out at the registry baseline into .vcpkg/,
      # and configures the relwithdebinfo preset.
      run: python3 scripts/bootstrap.py

    - name: Build
      # The DLL and the Windows launcher with llvm-mingw, then the Linux launcher with the host compiler. Its AppImage
      # goes into bin/RelWithDebInfo/GWToolbox.AppImage.
      run: python3 scripts/build.py --preset relwithdebinfo
      env:
        VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    - name: Compress the debug info
      run: |
        gzip -kf bin/RelWithDebInfo/GWToolboxdll.pdb
        gzip -kf bin/RelWithDebInfo/GWToolbox.pdb
        gzip -kf bin/RelWithDebInfo/GWToolbox.debug

    - name: Create release
      if: steps.version.outputs.should_release == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.version.outputs.tag_name }}
        VERSION: ${{ steps.version.outputs.version }}
        PRERELEASE: ${{ steps.version.outputs.prerelease }}
        BIN_DIR: ${{ github.workspace }}/bin/RelWithDebInfo
      run: |
        # Pull this version's patch notes from history.md for the release body. Exact heading
        # match so "8.3" can't grab "8.30"; stop at the next version heading. Fall back to a
        # non-empty placeholder so the Github API never returns a null body (which the updater
        # can't parse).
        awk -v ver="## Version ${VERSION}" '
          $0 == ver { f = 1; next }
          f && /^## Version / { exit }
          f { print }
        ' site/src/content/docs/history.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          printf 'GWToolbox++ %s\n\nSee https://gwtoolbox.com/history for details.\n' "$VERSION" > release_notes.md
        fi

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME"

        release_args=()
        if [ "$PRERELEASE" = 'true' ]; then
          release_args+=(--prerelease)
        fi

        gh release create "$TAG_NAME" \
          --title "$TAG_NAME" \
          --notes-file release_notes.md \
          "${release_args[@]}" \
          "$BIN_DIR/GWToolbox.exe" \
          "$BIN_DIR/GWToolboxdll.dll" \
          "$BIN_DIR/GWToolboxdll.pdb.gz" \
          "$BIN_DIR/GWToolbox.pdb.gz" \
          "$BIN_DIR/GWToolbox.AppImage" \
          "$BIN_DIR/GWToolbox.debug.gz"
