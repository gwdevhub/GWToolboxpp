name: CMake

on:
  # push covers dev (post-merge validation) and master (release builds, gated
  # below on should_release). pull_request covers PRs against dev - including
  # from forks, where CERTUM_OTP_URI is unset and signing/release is skipped -
  # so branches only build once a PR is open instead of on every push.
  push:
    branches:
      - dev
      - master
    paths: &cmake-paths
      # C/C++ source and headers
      - '**/*.cpp'
      - '**/*.c'
      - '**/*.h'
      # Win32 resources
      - '**/*.rc'
      - '**/*.ico'
      - '**/*.manifest'
      # Build system
      - 'CMakeLists.txt'
      - 'cmake/*.cmake'
      - 'CMakePresets.json'
      - 'CMakeSettings.json'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'vcpkg-overlays/**'
      # The workflow itself
      - '.github/workflows/cmake.yml'
  pull_request:
    branches:
      - dev
    paths: *cmake-paths

# Cancel a still-running build for the same ref when a new commit supersedes
# it, instead of letting both run to completion on the paid Windows runner.
concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: write
    # Exposed at job level so the release steps can gate on `env.CERTUM_OTP_URI`
    # (secrets can't be referenced directly in an `if:` expression).
    env:
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_USERID: ${{ secrets.CERTUM_USERID }}
      CERTUM_CERT_SHA1: ${{ secrets.CERTUM_CERT_SHA1 }}
      # Same trick for the GCS plugin-publish steps below - gate on env.GCP_SA_KEY.
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
#    - name: Setup Windows 10 SDK Action
#      uses: GuillaumeFalourd/setup-windows10-sdk-action@v2
#      with:
#        sdk-version: 22621

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache vcpkg toolchain
      id: cache-vcpkg-tool
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg
        key: vcpkg-tool-${{ runner.os }}-2b65c20fc66eda893aa15a15a453c3cf09500b19

    - name: Install vcpkg
      if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
      shell: bash
      # Keep in sync with the default-registry baseline in vcpkg-configuration.json:
      # this checkout provides scripts/, including the pinned msys2 package URLs that
      # vcpkg_fixup_pkgconfig downloads. Stale pins 404 once MSYS2 rotates them out.
      env:
        VCPKG_COMMIT: 2b65c20fc66eda893aa15a15a453c3cf09500b19
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        cd vcpkg
        git checkout "$VCPKG_COMMIT"
        ./bootstrap-vcpkg.bat

    - name: Set VCPKG_ROOT
      run: |
        echo "VCPKG_ROOT=$(Get-Location)\vcpkg" >> $env:GITHUB_ENV
      shell: powershell

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg-bincache
        key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}
        restore-keys: |
          vcpkg-bin-${{ runner.os }}-

    - name: Restore FetchContent cache
      uses: actions/cache@v4
      with:
        path: ${{runner.workspace}}/GWToolboxpp/build/_deps
        key: deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: Restore vcpkg installed cache
      uses: actions/cache@v4
      with:
        path: ${{runner.workspace}}/GWToolboxpp/build/vcpkg_installed
        key: vcpkg-inst-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/GWToolboxpp/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/GWToolboxpp/build
      run: cmake $GITHUB_WORKSPACE --preset=vcpkg -DGWTOOLBOX_BUILD_EXAMPLE_PLUGIN=OFF
      env:
        VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"

    - name: Build
      working-directory: ${{runner.workspace}}/GWToolboxpp/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config RelWithDebInfo

    - name: Save output
      uses: actions/upload-artifact@v4
      with:
        # GWToolboxdll.pdb.gz (compress.ps1, GWToolboxdll/CMakeLists.txt POST_BUILD) already carries the
        # debug info the raw .pdb has - excluded so the artifact doesn't ship both.
        path: |
          ${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo/*
          !${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo/GWToolboxdll.pdb

    # --- fork-only: third-party plugin artifacts --------------------------------
    # Every file the plugin build drops into bin/ for a plugin target (DLL, PDB,
    # and the SCTracker.version.json sidecar from cmake/gwtoolboxdll_plugins.cmake's
    # POST_BUILD) is staged for the release uncompressed - one loose, top-level
    # asset each. Plugin names come straight from add_tb_plugin() so a new plugin
    # is picked up automatically; ExamplePlugin is excluded (sample; also
    # -DGWTOOLBOX_BUILD_EXAMPLE_PLUGIN=OFF in CI). Guarded off upstream, which
    # ships no third-party plugins.
    - name: Stage plugin artifacts
      if: github.ref == 'refs/heads/master' && github.repository != 'gwdevhub/GWToolboxpp'
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $bin = "${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo"
        $staging = Join-Path $env:GITHUB_WORKSPACE 'staging/plugins'
        Remove-Item -Recurse -Force (Join-Path $env:GITHUB_WORKSPACE 'staging') -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path $staging | Out-Null
        $plugins = Select-String -Path cmake/gwtoolboxdll_plugins.cmake -Pattern 'add_tb_plugin\(([A-Za-z0-9_]+)' -AllMatches |
          ForEach-Object { $_.Matches.Groups[1].Value } |
          Where-Object { $_ -ne 'ExamplePlugin' } | Select-Object -Unique
        if (-not $plugins) { Write-Host 'no plugins to stage'; exit 0 }
        foreach ($p in $plugins) {
          $files = Get-ChildItem "$bin/$p.*" -File -ErrorAction SilentlyContinue
          if (-not $files) { Write-Warning "no build output for plugin $p"; continue }
          $files | Copy-Item -Destination $staging
        }
        Get-ChildItem $staging | Format-Table Name, Length -AutoSize

    - name: Determine release version
      id: version
      if: github.ref == 'refs/heads/master'
      shell: bash
      run: |
        VERSION=$(sed -n 's/.*set(GWTOOLBOXDLL_VERSION "\(.*\)").*/\1/p' CMakeLists.txt | tr -d '\r')
        BETA=$(sed -n 's/.*set(GWTOOLBOXDLL_VERSION_BETA "\(.*\)").*/\1/p' CMakeLists.txt | tr -d '\r')

        if [ -z "$VERSION" ]; then
          echo "Could not find version in CMakeLists.txt"
          exit 1
        fi

        if [ -z "$BETA" ]; then
          TAG_NAME="${VERSION}_Release"
        else
          TAG_NAME="${VERSION}_${BETA}"
        fi

        echo "Detected version: $VERSION"
        echo "Detected beta: $BETA"
        echo "Target tag: $TAG_NAME"
        echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

        if git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q .; then
          echo "Tag $TAG_NAME already exists. Skipping release."
          echo "should_release=false" >> "$GITHUB_OUTPUT"
        else
          echo "Tag $TAG_NAME does not exist. Will create release."
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        fi

    # Certum SimplySign code signing. The binaries are signed in place in
    # bin/RelWithDebInfo before the release upload. Each signing step is gated on
    # the CERTUM_OTP_URI secret being present, so forks and un-provisioned
    # environments still publish a release (unsigned) instead of failing.
    - name: Set up Certum SimplySign
      if: steps.version.outputs.should_release == 'true' && env.CERTUM_OTP_URI != ''
      shell: bash
      run: |
        chmod +x ./.github/scripts/install-simplysign.sh
        ./.github/scripts/install-simplysign.sh
        powershell -ExecutionPolicy Bypass -File "./.github/scripts/configure-simplysign.ps1"

    - name: Authenticate Certum SimplySign
      if: steps.version.outputs.should_release == 'true' && env.CERTUM_OTP_URI != ''
      shell: bash
      run: powershell -ExecutionPolicy Bypass -File "./.github/scripts/connect-simplysign.ps1"

    - name: Sign release binaries
      if: steps.version.outputs.should_release == 'true' && env.CERTUM_OTP_URI != ''
      shell: pwsh
      run: |
        $bin = "${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo"
        ./.github/scripts/sign-certum.ps1 -Files @("$bin/GWToolbox.exe", "$bin/GWToolboxdll.dll")

    # fork-only: sign the bundled plugin DLLs with the same cert. No-op on the
    # fork itself until CERTUM_* secrets are provisioned (skipped, ships unsigned).
    - name: Sign plugin binaries
      if: steps.version.outputs.should_release == 'true' && env.CERTUM_OTP_URI != '' && github.repository != 'gwdevhub/GWToolboxpp'
      shell: pwsh
      run: |
        $bin = "${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo"
        $dlls = Get-ChildItem "$bin/*.dll" | Where-Object { $_.Name -ne 'GWToolboxdll.dll' } | ForEach-Object { $_.FullName }
        if ($dlls) { ./.github/scripts/sign-certum.ps1 -Files $dlls }

    # Signing rewrites the dll after the build, so each plugin manifest's sha256
    # (written by plugins/Base/write-plugin-manifest.cmake at POST_BUILD time) is
    # now stale. Recompute just that field in place, leaving name/version/compiled_at.
    - name: Refresh plugin manifests after signing
      if: steps.version.outputs.should_release == 'true' && env.CERTUM_OTP_URI != '' && github.repository != 'gwdevhub/GWToolboxpp'
      shell: pwsh
      run: |
        $bin = "${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo"
        Get-ChildItem "$bin/*.version.json" | ForEach-Object {
          $name = $_.Name -replace '\.version\.json$', ''
          $dll = Join-Path $bin "$name.dll"
          if (-not (Test-Path $dll)) { return }
          $m = Get-Content $_.FullName -Raw | ConvertFrom-Json
          $m.sha256 = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          ($m | ConvertTo-Json) + "`n" | Set-Content -NoNewline -Encoding utf8 $_.FullName
        }

    # --- fork-only: publish SCTracker to the backend's private GCS bucket -------
    # The backend fetches SCTracker.dll + SCTracker.version.json from this bucket
    # at runtime (1h cache) instead of bundling them in its image, so a plugin-only
    # update needs no backend redeploy. Runs on every master build (mirrors
    # "Publish rolling plugins-latest"), after the manifest sha256 has been
    # corrected for any signing above. Needs the GCP_SA_KEY secret + the
    # GCP_PLUGIN_BUCKET repo variable; a no-op on forks without them.
    - name: Authenticate to Google Cloud (plugin bucket)
      if: github.ref == 'refs/heads/master' && github.repository != 'gwdevhub/GWToolboxpp' && env.GCP_SA_KEY != ''
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      if: github.ref == 'refs/heads/master' && github.repository != 'gwdevhub/GWToolboxpp' && env.GCP_SA_KEY != ''
      uses: google-github-actions/setup-gcloud@v2

    - name: Publish SCTracker plugin to GCS
      if: github.ref == 'refs/heads/master' && github.repository != 'gwdevhub/GWToolboxpp' && env.GCP_SA_KEY != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ ! -f staging/plugins/SCTracker.dll ]; then
          echo "no SCTracker build staged; nothing to publish"; exit 0
        fi
        BUCKET="${{ vars.GCP_PLUGIN_BUCKET }}"
        if [ -z "$BUCKET" ]; then
          echo "GCP_PLUGIN_BUCKET repo variable is not set; skipping"; exit 0
        fi
        # DLL first, manifest second: a backend refresh racing the two uploads then
        # never sees a manifest sha256 pointing ahead of the bytes. --cache-control
        # keeps any GCS/CDN layer from stacking staleness on the backend's own TTL.
        gcloud storage cp staging/plugins/SCTracker.dll \
          "gs://$BUCKET/sctracker/SCTracker.dll" --cache-control=no-cache
        gcloud storage cp staging/plugins/SCTracker.version.json \
          "gs://$BUCKET/sctracker/SCTracker.version.json" --cache-control=no-cache

    - name: Create release
      if: steps.version.outputs.should_release == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${{ steps.version.outputs.tag_name }}"
        VERSION="${{ steps.version.outputs.version }}"
        BIN_DIR="${{runner.workspace}}/GWToolboxpp/bin/RelWithDebInfo"

        # Already built by compress.ps1 (GWToolboxdll/CMakeLists.txt POST_BUILD) - no need to re-gzip.
        cp "$BIN_DIR/GWToolboxdll.pdb.gz" GWToolboxdll.pdb.gz

        # Pull this version's patch notes from history.md for the release body. Exact heading
        # match so "8.3" can't grab "8.30"; stop at the next version heading. Fall back to a
        # non-empty placeholder so the Github API never returns a null body (which the updater
        # can't parse).
        awk -v ver="## Version ${VERSION}" '
          $0 == ver { f = 1; next }
          f && /^## Version / { exit }
          f { print }
        ' site/src/content/docs/history.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          printf 'GWToolbox++ %s\n\nSee https://gwtoolbox.com/history for details.\n' "$VERSION" > release_notes.md
        fi

        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag "$TAG_NAME"
        git push origin "$TAG_NAME"

        # Plugin artifacts are staged only on the fork (see "Stage plugin
        # artifacts") - attach each as a loose, top-level asset when present.
        EXTRA=()
        if [ -d staging/plugins ]; then
          for f in staging/plugins/*; do [ -e "$f" ] && EXTRA+=("$f"); done
        fi

        gh release create "$TAG_NAME" \
          --title "$TAG_NAME" \
          --notes-file release_notes.md \
          "$BIN_DIR/GWToolbox.exe" "$BIN_DIR/GWToolboxdll.dll" GWToolboxdll.pdb.gz "${EXTRA[@]}"

    # --- fork-only: rolling plugins-latest release --------------------------------
    # Plugins link against GWToolboxdll, so every master build produces a fresh
    # compatible set. This keeps a single "plugins-latest" pre-release whose assets
    # (the loose plugin build artifacts) are overwritten in place on every master
    # build - independent of the versioned GWToolbox release above, which only
    # fires on a CMakeLists.txt version bump.
    - name: Publish rolling plugins-latest release
      if: github.ref == 'refs/heads/master' && github.repository != 'gwdevhub/GWToolboxpp' && hashFiles('staging/plugins/**') != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if ! gh release view plugins-latest >/dev/null 2>&1; then
          gh release create plugins-latest \
            --prerelease \
            --title "Plugins (latest master)" \
            --notes "Third-party plugin build artifacts, refreshed on every master push. Rolling: assets are overwritten in place, not versioned."
        fi
        # One-time cleanup: drop the zipped asset an earlier version of this workflow uploaded.
        gh release delete-asset plugins-latest plugins.zip -y 2>/dev/null || true
        assets=()
        for f in staging/plugins/*; do [ -e "$f" ] && assets+=("$f"); done
        gh release upload plugins-latest --clobber "${assets[@]}"
