<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWToolbox - Launch</title>
<style><!--launcher.css--></style>
</head>
<body>
<div class="titlebar" id="titlebar">
    <span class="title">GWToolbox - Launch</span>
    <button id="close" aria-label="Close">&#x2715;</button>
</div>
<main>
    <fieldset id="pick">
        <legend>Select Character</legend>
        <div class="row">
            <select id="characters" class="grow" aria-label="Character"></select>
            <button id="launch" class="primary">Launch</button>
        </div>
    </fieldset>
    <div class="row" id="not-found" hidden>
        <div class="error grow" id="error"></div>
        <button id="retry" class="primary">Retry</button>
    </div>
    <button class="link" id="troubleshooting" hidden>Open troubleshooting guide</button>
    <button class="link" id="admin" hidden>Can't find your character?</button>
    <div class="row">
        <span class="grow" id="update-status"></span>
        <button id="update" hidden>Update</button>
        <button id="settings">Settings...</button>
    </div>
</main>
<script><!--launcher.js--></script>
<script>
const $ = (id) => document.getElementById(id);
let found = false;
let busy = false;
let characterList = '';

const controls = () => [...document.querySelectorAll('main button')];

const render = (state) => {
    found = state.found;
    $('pick').hidden = !state.found;
    $('not-found').hidden = state.found;
    $('error').textContent = state.error;
    $('troubleshooting').hidden = !state.troubleshooting;
    $('admin').hidden = !state.canRestartAsAdmin;
    $('update').hidden = !state.updateAvailable;
    $('update-status').textContent = state.updateStatus;

    const list = JSON.stringify(state.characters);
    if (list !== characterList) {
        characterList = list;
        $('characters').replaceChildren(...state.characters.map((label, index) => new Option(label, index)));
        $('characters').value = String(state.selected);
    }
};

const refresh = async () => {
    if (!busy) {
        render(await launcher.call('getState'));
    }
};

const perform = async (method, ...args) => {
    if (busy) {
        return;
    }
    busy = true;
    controls().forEach((button) => button.disabled = true);
    try {
        await launcher.call(method, ...args);
    } finally {
        busy = false;
        controls().forEach((button) => button.disabled = false);
        await refresh();
    }
};

const launch = () => {
    if (found) {
        perform('launch', Number($('characters').value));
    }
};

$('launch').addEventListener('click', launch);
$('retry').addEventListener('click', () => perform('retry'));
$('troubleshooting').addEventListener('click', () => perform('troubleshooting'));
$('admin').addEventListener('click', () => perform('restartAsAdmin'));
$('update').addEventListener('click', () => perform('update'));
$('settings').addEventListener('click', () => perform('settings'));

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        launcher.call('close');
    } else if (event.key === 'Enter' && !event.target.matches('button')) {
        found ? launch() : perform('retry');
    }
});

launcher.wireTitleBar();
launcher.call('ready').then(() => {
    setInterval(refresh, 500);
    return refresh();
});
</script>
</body>
</html>
