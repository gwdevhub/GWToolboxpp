<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWToolbox - Settings</title>
<style><!--launcher.css--></style>
</head>
<body>
<div class="titlebar" id="titlebar">
    <span class="title">GWToolbox - Settings</span>
    <button id="close" aria-label="Close">&#x2715;</button>
</div>
<main>
    <label class="row"><input type="checkbox" id="no-update"> Never check for update</label>
    <label class="row"><input type="checkbox" id="as-admin"> Always start as admin</label>
</main>
<script><!--launcher.js--></script>
<script>
const options = [
    ['no-update', 'noUpdate'],
    ['as-admin', 'asAdmin'],
];

for (const [elementId, name] of options) {
    document.getElementById(elementId).addEventListener('change', (event) => {
        launcher.call('setOption', name, event.target.checked);
    });
}

launcher.wireTitleBar();
launcher.call('ready')
    .then(() => launcher.call('getState'))
    .then((state) => {
        document.getElementById('no-update').checked = state.noUpdate;
        document.getElementById('as-admin').checked = state.asAdmin;
    });
</script>
</body>
</html>
